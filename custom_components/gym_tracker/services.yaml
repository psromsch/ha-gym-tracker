add_set:
  name: Add set
  description: >-
    Record a set for an exercise using its current weight and reps inputs.
    Both must be greater than zero or the call is a no-op.
  fields:
    base:
      name: Exercise
      description: The exercise base slug (e.g. bench_press).
      required: true
      example: bench_press
      selector:
        text:

undo_last_set:
  name: Undo last set
  description: >-
    Remove the most recent set. Falls back to the last set of the most
    recent finished session if the current session is empty.
  fields:
    base:
      name: Exercise
      description: The exercise base slug (e.g. bench_press).
      required: true
      example: bench_press
      selector:
        text:

finish_exercise:
  name: Finish exercise
  description: >-
    Close out the current session, prepending it to history. No-op if the
    current session has no sets.
  fields:
    base:
      name: Exercise
      description: The exercise base slug (e.g. bench_press).
      required: true
      example: bench_press
      selector:
        text:

delete_set:
  name: Delete set
  description: >-
    Remove one set from any session. Subtracts its volume from that session's
    total and from the lifetime total (both clamped at 0) and recomputes the
    session's max weight. Does not adjust weekly muscle counters.
  fields:
    base:
      name: Exercise
      description: The exercise base slug (e.g. bench_press).
      required: true
      example: bench_press
      selector:
        text:
    session_index:
      name: Session index
      description: "-1 = current (Today) session; 0 = most recent finished (T-1); 1 = T-2; …"
      required: true
      example: 0
      selector:
        number:
          min: -1
          max: 100
          step: 1
          mode: box
    set_index:
      name: Set index
      description: "0-based index of the set within the session (0 = first set)."
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box

delete_session:
  name: Delete session
  description: >-
    Remove a whole session and subtract its total from the lifetime total
    (clamped at 0). Does not adjust weekly muscle counters.
  fields:
    base:
      name: Exercise
      description: The exercise base slug (e.g. bench_press).
      required: true
      example: bench_press
      selector:
        text:
    session_index:
      name: Session index
      description: "-1 = current (Today) session; 0 = most recent finished (T-1); 1 = T-2; …"
      required: true
      example: 0
      selector:
        number:
          min: -1
          max: 100
          step: 1
          mode: box

add_exercise:
  name: Add exercise
  description: >-
    Add a user-defined exercise and create its entities (via a config-entry
    reload). Built-in exercises cannot be redefined. Re-adding a previously
    removed base restores its stored history.
  fields:
    base:
      name: Base slug
      description: Lowercase entity-id stem, e.g. cable_fly. Letters, digits, underscores.
      required: true
      example: cable_fly
      selector:
        text:
    name:
      name: Display name
      description: Friendly name, e.g. "Cable Fly".
      required: true
      example: Cable Fly
      selector:
        text:
    focus:
      name: Day focus
      description: Which day-focus group the exercise lives under.
      required: false
      default: Chest
      selector:
        select:
          options: [Lower, Biceps, Lats, Chest, Triceps, Shoulders]
    muscles:
      name: Muscle groups
      description: One or more muscle groups this exercise credits per set.
      required: true
      example: "[chest]"
      selector:
        select:
          multiple: true
          options:
            - chest
            - shoulders
            - lats
            - biceps
            - triceps
            - quads
            - hamstrings
            - glutes
            - calves
            - adductor
            - abs
    chart_min:
      name: Chart minimum
      description: y-axis floor for the exercise's ApexCharts card.
      required: false
      default: 20
      selector:
        number:
          min: 0
          max: 500
          step: 1
          mode: box

remove_exercise:
  name: Remove exercise
  description: >-
    Remove a user-added exercise and its entities (via a config-entry reload).
    Built-in exercises cannot be removed. Stored history is kept so re-adding
    the same base restores it.
  fields:
    base:
      name: Base slug
      description: The user-added exercise's base slug.
      required: true
      example: cable_fly
      selector:
        text:
